<h2 mat-dialog-title class="dialog-title">
  <mat-icon color="warn" class="title-icon">warning_amber</mat-icon>
  <span>{{ 'unsavedChanges.title' | translate }}</span>
</h2>
<mat-dialog-content class="dialog-content">
  <p>{{ 'unsavedChanges.message' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" [mat-dialog-close]="false">
    {{ 'unsavedChanges.stay' | translate }}
  </button>
  <button mat-flat-button color="warn" type="button" [mat-dialog-close]="true">
    {{ 'unsavedChanges.leave' | translate }}
  </button>
</mat-dialog-actions>
